<header class="header">
  <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Post Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Option1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Option2</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<main>
  <div class="container p-3 d-flex flex-column flex-lg-row justify-content-between gap-5 border-red">
    <div class="newPost p-3 w-100 w-lg-25 border-blue flex-grow-1 flex-lg-grow-0">
      <h2 class="text-primary">New Post</h2>
      <hr>
      <div>
        <label for="username" class="form-label">Username</label>
        <input class="form-control" id="username" type="text" maxlength="25" placeholder="Username">
      </div>
      <div>
        <label for="title" class="form-label">Title</label>
        <input class="form-control" id="title" type="text" maxlength="100" placeholder="Title">
      </div>
      <div>
        <label for="body" class="form-label">Body</label>
        <textarea class="form-control" id="body" type="text" rows="10" placeholder="Body"></textarea>
      </div>
      <div>
        <label for="image" class="form-label">Image URL</label>
        <input class="form-control" id="image" type="text" placeholder="Image URL">
      </div>
      <button class="btn btn-primary mt-3">Post it!</button>
    </div>
    <div class="postList p-3 border-blue flex-grow-1 flex-lg-grow-0">
      <h2 class="text-primary">Post List</h2>
      <hr>

      @for (post of arrPosts; track post) {
        <article class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative align-items-center">
          <div class="col-auto d-none d-md-block ms-3 ms-lg-3">
            <img class="bd-placeholder-img object-fit-cover" width="250" height="250" src="{{post.imageURL}}" alt="" preserveAspectRatio="xMidYMid slice" focusable="false">
          </div>
          <div class="col p-4 d-flex flex-column position-static">
            <strong class="d-inline-block mb-2 text-success-emphasis">{{post.username}}</strong>
            <h3 class="mb-0">{{post.title}}</h3>
            <div class="mb-1 text-body-secondary">{{post.date}}</div>
            <p class="mb-auto">{{post.body}}</p>
          </div>
        </article>
      }

    </div>
  </div>
</main>
