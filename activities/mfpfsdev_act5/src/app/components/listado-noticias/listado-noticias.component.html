<div class="noticias">

    <div class="selected__noticia">
        <div class="cabecera">
            <h2 class="noticia__title">{{selectedNoticia.titulo}}</h2>
        <p class="noticia__date">{{selectedNoticia.fecha}}</p>
        </div>
        
        <img class="noticia__img" src="{{selectedNoticia.imagen}}" alt="">
        <p>{{selectedNoticia.cuerpo}}</p>
    </div>

    <div class="listado__noticias">
        <!-- <div class="noticias__cabecera"> -->
            <h2 class="heading-2">Listado de noticias</h2>
            <!-- <div class="category__container">
                <span>Categoría:</span>
                <select (change)="capturarCategoria($event)">
                    <option value="">Selecciona una categoria</option>
                    @for(categoria of categorias; track categoria){
                        <option value="{{categoria}}">{{categoria}}</option>
                    }
                </select>
            </div> -->
            
        <!-- </div> -->
        
        <section class="flex scrollable-container">
            @for (noticia of noticias; track noticia) {
                <!-- <article class="card" > -->
                    <article class="card" (click)="selectNoticia(noticia)">
                    <figure class="card__figure">
                        <img class="card__img" src="{{noticia.imagen}}" alt="{{noticia.titulo}}">
                    </figure>
                    <h3 class="card__title">{{noticia.titulo}}</h3>
                    <p class="card__date">{{noticia.fecha}}</p>
                </article>
            }
            <!-- @if (modalSwitch){
                <app-modal-noticia (sendCloseAction)="getCloseAction($event)"></app-modal-noticia>
            } -->
        </section>
    </div>
</div>
