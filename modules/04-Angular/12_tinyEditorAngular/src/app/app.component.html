<section class="container mt-4">
  <div class="card shadow p-4">
    <form [formGroup]="tinyForm" (ngSubmit)="getDataForm()">
      <div class="my-3">
        <label for="title" class="form-label">Titulo</label>
        <input class="form-control" type="text" id="title" formControlName="title">
      </div>
      <div class="my-3">
        <label for="content" class="form-label">Contenido</label>
        <quill-editor class="content" formControlName="content"></quill-editor>
      </div>
      <div class="my-3">
        <input type="submit" value="Enviar" class="btn btn-danger">
      </div>
    </form>
  </div>
</section>
<section [innerHTML]="texto"></section>
