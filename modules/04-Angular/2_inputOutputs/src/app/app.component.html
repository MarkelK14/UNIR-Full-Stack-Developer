<header>
  <h1>Calculadora Casio</h1>
  <hr>
</header>
<main class="flex">
  <section>
    <!-- calculadora -->
    <app-calculadora (calculoEmitido)="obtenerCalculo($event)"></app-calculadora>
  </section>
  <section>
    <!-- lista de calculos -->
    <app-lista-calculos [listacalculos]="arrCalculos" [colorfondo]=" 'lightblue' "></app-lista-calculos>

  </section>
</main>
