<div class="form">
    <input type="text" placeholder="Nombre del producto" [(ngModel)]="newProduct.title">
    <input type="number" placeholder="Precio (€)" [(ngModel)]="newProduct.price">
    <input type="number" placeholder="Cantidad" [(ngModel)]="newProduct.quantity">
    <button (click)="addProduct()">AÑADIR A LA LISTA</button>
</div>
