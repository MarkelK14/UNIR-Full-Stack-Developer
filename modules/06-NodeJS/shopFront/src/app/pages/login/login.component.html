<div class="row">
    <div class="col-12 offset-0 col-md-4 offset-md-4">
        <h1>Login</h1>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control" formControlName="email" placeholder="Enter your email" />
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="text" class="form-control" formControlName="password" placeholder="Enter your email" />
            </div>
            <input type="submit" class="btn btn-info" value="Enviar">
        </form>
    </div>
</div>
