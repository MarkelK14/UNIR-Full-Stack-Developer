<div class="row">
    <div class="col-12 offset-0 col-md-6 offset-md-3">
        <h1>Nuevo producto</h1>
        <form [formGroup]="newProductForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" formControlName="name" />
            </div>
            <div class="mb-3">
                <label class="form-label">Descripcion</label>
                <input type="text" class="form-control" formControlName="description" />
            </div>
            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" class="form-control" formControlName="price" />
            </div>
            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input type="number" class="form-control" formControlName="stock" />
            </div>
            <div class="mb-3">
                <label class="form-label">Departamento</label>
                <input type="text" class="form-control" formControlName="department" />
            </div>
            <div class="mb-3">
                <label class="form-label">Disponible</label>
                <input type="text" class="form-control" formControlName="available" />
            </div>
            <div class="mb-3">
                <label class="form-label">Imagen</label>
                <input type="file" class="form-control" (change)="onFileSelected($event)"/>
            </div>

            <input type="submit" class="btn btn-info" value="Enviar">
        </form>
    </div>
</div>
